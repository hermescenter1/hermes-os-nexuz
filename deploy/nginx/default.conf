server {
    listen 80;
    listen [::]:80;
    server_name hermesnovin.com www.hermesnovin.com 185.80.196.163;

    # Structured, privacy-safe access log (format: 00-observability.conf) and
    # the correlation id returned to the client. $request_id is generated by
    # Nginx; a client-supplied X-Request-ID is never trusted or echoed.
    access_log /dev/stdout hermes_json;
    add_header X-Request-ID $request_id always;

    location = /api/health {
        proxy_pass http://hermes-web:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        access_log off;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://hermesnovin.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hermesnovin.com www.hermesnovin.com 185.80.196.163;

    if ($host = www.hermesnovin.com) {
        return 308 https://hermesnovin.com$request_uri;
    }

    ssl_certificate     /etc/letsencrypt/live/hermesnovin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hermesnovin.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/hermesnovin.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    # Structured, privacy-safe access log (format: 00-observability.conf) and
    # the correlation id returned to the client. $request_id is generated by
    # Nginx; a client-supplied X-Request-ID is never trusted or echoed.
    access_log /dev/stdout hermes_json;
    add_header X-Request-ID $request_id always;

    location / {
        proxy_pass http://hermes-web:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        # The server-level add_header returns the same id; drop any upstream copy
        # so the response never carries two X-Request-ID headers.
        proxy_hide_header X-Request-ID;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
