# Hermes OS - privacy-safe Nginx access-log evidence (http context).
#
# Mounted read-only at /etc/nginx/conf.d/00-observability.conf; the official
# nginx image includes conf.d/*.conf inside `http {}`, so this file may ONLY
# contain http-level directives (log_format / map), never server/location.
# It sorts before default.conf so the names exist when default.conf uses them.
#
# Scope: bounded host/container log evidence for diagnosing public 5xx and
# timeouts. NOT a durable metrics backend and NOT a replacement for external
# uptime monitoring or Cloudflare logs. Retention is the Docker json-file
# rotation configured for the nginx service in docker-compose.prod.yml.
#
# Privacy contract - every value below is either generated by Nginx or mapped
# onto a fixed vocabulary. The request URI, query string, cookies,
# Authorization, X-Forwarded-For, client IPs, user agents, referers and bodies
# are NEVER referenced by the log format.

# Fixed vocabulary for the HTTP method (an arbitrary client token is never copied).
map $request_method $hermes_log_method {
    default  OTHER;
    GET      GET;
    HEAD     HEAD;
    POST     POST;
    PUT      PUT;
    PATCH    PATCH;
    DELETE   DELETE;
    OPTIONS  OPTIONS;
}

# Fixed vocabulary for the Host header (an arbitrary client Host is never copied).
map $host $hermes_log_host {
    default                 other;
    hermesnovin.com         hermesnovin.com;
    www.hermesnovin.com     www.hermesnovin.com;
    mail.hermesnovin.com    mail.hermesnovin.com;
}

# Bounded route classifier over $uri (decoded path, no query string). Dynamic
# segments are classified, never copied. Regex entries are evaluated in file
# order and the first match wins; the fallback is other_public.
map $uri $hermes_route_class {
    default                                          other_public;

    ~^/api/health(/|$)                               health;
    ~^/\.well-known/acme-challenge/                  acme_challenge;
    ~^/robots\.txt$                                  robots;
    ~^/sitemap[^/]*\.xml$                            sitemap;
    ~^/_next/                                        next_static;
    ~^/api/                                          api;

    ~^/fa/?$                                         locale_root_fa;
    ~^/en/?$                                         locale_root_en;
    ~^/de/?$                                         locale_root_de;
    ~^/ar/?$                                         locale_root_ar;
    ~^/$                                             site_root;

    ~^/((fa|en|de|ar)/)?platform(/|$)                platform;
    ~^/((fa|en|de|ar)/)?services(/|$)                services;
    ~^/((fa|en|de|ar)/)?(industrial-brain|brain)(/|$) industrial_brain;
    ~^/((fa|en|de|ar)/)?articles(/|$)                articles;
    ~^/((fa|en|de|ar)/)?library(/|$)                 library;
    ~^/((fa|en|de|ar)/)?careers(/|$)                 careers;
}

# One JSON object per event. escape=json makes every interpolated value a valid
# JSON string fragment. $request_id is Nginx's own 32-hex random id (never a
# client-supplied value). Duration and upstream fields are quoted strings
# because Nginx may emit "-" or a comma-separated list on retries/redirects.
log_format hermes_json escape=json
    '{'
    '"timestamp":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$hermes_log_method",'
    '"route_class":"$hermes_route_class",'
    '"status":"$status",'
    '"upstream_status":"$upstream_status",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"host":"$hermes_log_host",'
    '"protocol":"$server_protocol"'
    '}';
