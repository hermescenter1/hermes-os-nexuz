# Validation CI for pull requests to main (Gate 0A safety contract).
#
# Deliberately separated from production deployment: this workflow has no
# secrets, no SSH material, no environment access and read-only repository
# permissions. It can never reach production.
#
# The build-time environment values below are NON-SECRET, CI-safe placeholders
# copied from the repository's own Dockerfile build stage. They point only at
# localhost / a non-routable placeholder host, so the build cannot contact any
# external system. They are NOT production credentials.

name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (prisma, types, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Production Compose project static check (Gate 0D-A)
        run: node scripts/production-compose-project-static-check.mjs

      - name: Install dependencies
        run: npm ci

      # PHASE 99.6 — explicit, always-on dependency security gate.
      #
      # Phase 99 remediated every CRITICAL/HIGH advisory and Phase 99.5 forward-
      # ported that remediation onto main, but nothing in CI FAILED on a new one:
      # the Phase 99 workflow only publishes a sanitized audit artifact, and it
      # does not run on every pull request. A HIGH advisory landing in a
      # transitive dependency would therefore have gone unnoticed until the next
      # manual review.
      #
      # Invariant: DEPENDENCY_CRITICAL=0 and DEPENDENCY_HIGH=0 on every PR.
      #
      # 2026-10-03 — this step used to be a bare `npm audit --audit-level=high`.
      # That decided correctly until a HIGH advisory landed in a transitive
      # package with NO published safe version: `braces` (GHSA-vfj7-8cjw-p6xm) is
      # at its latest release AND inside the advisory range, and it is reachable
      # only through `tailwindcss@3` and `eslint-config-next@15`. The raw command
      # then leaves two bad options — lower the bar for everything, or take an
      # unreviewed design-system major — and a gate with no third option is
      # exactly how `--audit-level=critical` gets committed.
      #
      # `gate:dependency-audit` is NOT equivalent to raw zero-HIGH enforcement,
      # and the trade is deliberate rather than a loophole.
      #
      # STRICTER than the raw command for: production HIGH/CRITICAL (no exception
      # mechanism exists for these at all), any CRITICAL anywhere (never
      # exceptionable), any new or unapproved HIGH including a new advisory on an
      # already-approved package, dependency-path drift, production reachability,
      # expiry, a stale/orphaned exception, and malformed audit output — which
      # BLOCKS with exit 2 rather than passing.
      #
      # MORE PERMISSIVE for exactly one thing: the seven enumerated dev-only HIGH
      # findings in docs/security/dependency-audit-exceptions.json, until
      # 2026-11-02. That list cannot grow without a reviewed change to a
      # committed file.
      #
      # Nothing is concealed — the full tree is audited and every finding is
      # printed — and those seven are labelled ACCEPTED_TEMPORARY_DEV_ONLY_RISK,
      # which means UNRESOLVED RISK, never "fixed".
      #
      # Exceptions live in docs/security/dependency-audit-exceptions.json and the
      # reasoning in docs/security/dependency-audit-governance.md.
      #
      # If this fails, remediate the advisory. Do NOT downgrade `sharp` to dodge
      # its CPU requirement — the pinned 0.35.3 is deliberate (see
      # docs/security/phase99-dependency-remediation.md).
      - name: Dependency security gate (0 critical, 0 unapproved high)
        run: npm run gate:dependency-audit

      - name: Generate Prisma client
        env:
          # prisma.config.ts resolves env("DATABASE_URL") when the CLI loads it,
          # so generate needs the placeholder too (localhost, never dialed).
          DATABASE_URL: postgresql://hermes:changeme@localhost:5432/hermes_db
        run: npx --no-install prisma generate

      - name: Validate Prisma schema
        env:
          # Placeholder connection string (localhost, never dialed by validate).
          DATABASE_URL: postgresql://hermes:changeme@localhost:5432/hermes_db
        run: npm run db:validate

      - name: Type-check (no emit)
        run: npx --no-install tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          # Non-secret CI-safe build placeholders mirroring the Dockerfile build
          # stage. All hosts are localhost / non-routable — no external contact.
          NODE_ENV: production
          DATABASE_URL: postgresql://hermes:changeme@localhost:5432/hermes_db
          JWT_ACCESS_SECRET: build-time-placeholder-64-chars-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_REFRESH_SECRET: build-time-placeholder-64-chars-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          NEXT_PUBLIC_APP_URL: https://placeholder.build
          APP_URL: https://placeholder.build
          HERMES_STORAGE_MODE: session
        run: npm run build

  # ---------------------------------------------------------------------------
  # PHASE 91 — live PostgreSQL rehearsal + real-database security integration.
  #
  # A CI-local PostgreSQL 16 service (pgvector, matching production's vector
  # columns). The credentials below are DISPOSABLE, CI-only, and only ever reach
  # a localhost service container — they are NOT and cannot access production or
  # staging. No repository secrets, no SSH, no external environment, read-only
  # repo permissions (inherited), a job timeout, and a database health check. No
  # continue-on-error: any failed assertion fails the job.
  # ---------------------------------------------------------------------------
  phase91-postgres:
    name: Phase 91 PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://hermes_ci:phase91-ci-only-password@localhost:5432/hermes_phase91_ci
      LEGACY_DATABASE_URL: postgresql://hermes_ci:phase91-ci-only-password@localhost:5432/hermes_phase91_legacy
      HERMES_STORAGE_MODE: database
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hermes_ci
          POSTGRES_PASSWORD: phase91-ci-only-password
          POSTGRES_DB: hermes_phase91_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_ci -d hermes_phase91_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Fresh migration rehearsal (prisma migrate deploy on an empty database)
        run: npx --no-install prisma migrate deploy

      - name: Validate Prisma schema against the migrated database
        run: npm run db:validate

      - name: Real PostgreSQL security integration suite
        run: npm run test:phase91:postgres

      - name: Legacy upgrade rehearsal (base data survives the Phase 91 migrations)
        env:
          # This step operates on a SEPARATE, freshly created database; the main
          # DATABASE_URL above is the maintenance connection used only to CREATE it.
          DATABASE_URL: postgresql://hermes_ci:phase91-ci-only-password@localhost:5432/hermes_phase91_legacy
          MAINT_DATABASE_URL: postgresql://hermes_ci:phase91-ci-only-password@localhost:5432/hermes_phase91_ci
        run: node scripts/ci/phase91-legacy-upgrade.mjs

  # ---------------------------------------------------------------------------
  # PHASE 92 — observability migration rehearsal + audit-retention integration.
  #
  # A CI-local PostgreSQL 16 service (pgvector, matching production). Credentials
  # are DISPOSABLE, CI-only, reach only a localhost service container, and cannot
  # touch production or staging. No repository secrets, no SSH, read-only repo
  # permissions (inherited), a job timeout, a DB health check, and NO
  # continue-on-error: any failed assertion fails the job.
  # ---------------------------------------------------------------------------
  phase92-postgres:
    name: Phase 92 PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://hermes_ci:phase92-ci-only-password@localhost:5432/hermes_phase92_ci
      LEGACY_DATABASE_URL: postgresql://hermes_ci:phase92-ci-only-password@localhost:5432/hermes_phase92_legacy
      HERMES_STORAGE_MODE: database
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hermes_ci
          POSTGRES_PASSWORD: phase92-ci-only-password
          POSTGRES_DB: hermes_phase92_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_ci -d hermes_phase92_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Fresh migration rehearsal (prisma migrate deploy on an empty database)
        run: npx --no-install prisma migrate deploy

      - name: Idempotency — a second deploy must report no pending migrations
        run: |
          npx --no-install prisma migrate deploy
          npx --no-install prisma migrate status

      - name: Validate Prisma schema against the migrated database
        run: npm run db:validate

      - name: Observability indexes + audit-retention integration suite
        run: npm run test:phase92:postgres

      - name: Legacy-populated rehearsal (indexes on a populated table + CONCURRENTLY path)
        env:
          # This step operates on a SEPARATE, freshly created database; the main
          # DATABASE_URL above is the maintenance connection used only to CREATE it.
          DATABASE_URL: postgresql://hermes_ci:phase92-ci-only-password@localhost:5432/hermes_phase92_legacy
          MAINT_DATABASE_URL: postgresql://hermes_ci:phase92-ci-only-password@localhost:5432/hermes_phase92_ci
        run: node scripts/ci/phase92-legacy-rehearsal.mjs

  # ---------------------------------------------------------------------------
  # PHASE 93 — disaster-recovery restore rehearsal (real backup → restore cycle).
  #
  # Exercises the ACTUAL operational pipeline (backup-postgres.sh /
  # verify-backup.sh / restore-postgres.sh flags) against a disposable CI-local
  # PostgreSQL 16 service: pg_dump (custom) → pg_restore --list verify → drop →
  # timed pg_restore → per-table row-count integrity proof → idempotent migrate
  # deploy → fresh-DB restore. Measures a real RTO. Credentials are DISPOSABLE,
  # CI-only, reach only a localhost service container, and cannot touch production
  # or staging. No secrets, no SSH, read-only repo permissions (inherited), a job
  # timeout, a DB health check, and NO continue-on-error: any failure fails the job.
  # ---------------------------------------------------------------------------
  phase93-dr:
    name: Phase 93 disaster-recovery restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `prisma generate` loads prisma.config.ts, which resolves env("DATABASE_URL")
      # at CLI load — so the generate step needs it even though this job dials
      # per-database URLs from the rehearsal script. Points at the maintenance DB.
      DATABASE_URL: postgresql://hermes_ci:phase93-ci-only-password@localhost:5432/hermes_phase93_ci
      # Maintenance connection: used only to CREATE/DROP the rehearsal databases.
      MAINT_DATABASE_URL: postgresql://hermes_ci:phase93-ci-only-password@localhost:5432/hermes_phase93_ci
      HERMES_STORAGE_MODE: database
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hermes_ci
          POSTGRES_PASSWORD: phase93-ci-only-password
          POSTGRES_DB: hermes_phase93_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_ci -d hermes_phase93_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Show pg_dump / pg_restore client version (must be >= pg16 server)
        run: pg_dump --version && pg_restore --version

      - name: Disaster-recovery restore rehearsal (backup → restore → integrity + RTO)
        run: node scripts/ci/phase93-dr-restore-rehearsal.mjs

  # ---------------------------------------------------------------------------
  # PHASE 95 — offline AI governance & model assurance evaluation.
  #
  # Deterministic, OFFLINE governance suite: model-registry static gate,
  # tenant-provider policy (default-deny), prompt-injection screening, RAG
  # provenance/poisoning, citation integrity, unsafe-output blocking, evidence
  # sufficiency, deterministic-first routing, execution-trace redaction, plus the
  # synthetic adversarial datasets with zero-tolerance safety/security budgets,
  # and a secret-leak scan. It makes NO external provider call, needs no service
  # container, no secrets and no Production access. No continue-on-error: any
  # failed assertion or budget violation fails the job.
  # ---------------------------------------------------------------------------
  phase95-ai-governance:
    name: Phase 95 AI governance evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://hermes:changeme@localhost:5432/hermes_db
        run: npx --no-install prisma generate

      - name: Offline AI-governance evaluation (deterministic, no provider calls)
        run: node scripts/ci/phase95-ai-governance-eval.mjs

  # ---------------------------------------------------------------------------
  # PHASE 96 — offline commercial billing & entitlement governance evaluation.
  #
  # Deterministic, OFFLINE billing suite: fail-closed entitlement resolver,
  # subscription state machine, Stripe→domain event mapper + offline signature
  # proof, webhook idempotency/replay/out-of-order, money/refund bounds, audit
  # redaction, wired-route entitlement gating, plus the synthetic adversarial
  # datasets with zero-tolerance budgets, and a secret-leak scan. It makes NO
  # external provider call, contacts NO payment provider, needs no service
  # container, no secrets and no Production access. No continue-on-error: any
  # failed assertion or budget violation fails the job.
  # ---------------------------------------------------------------------------
  phase96-billing-governance:
    name: Phase 96 billing governance evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://hermes:changeme@localhost:5432/hermes_db
        run: npx --no-install prisma generate

      - name: Offline billing-governance evaluation (no provider calls)
        run: node scripts/ci/phase96-billing-governance-eval.mjs

  # ---------------------------------------------------------------------------
  # PHASE 96 — billing migration rehearsal + seat-limit concurrency proof.
  #
  # A CI-local PostgreSQL 16 service (pgvector, matching production). Applies the
  # additive Phase 96 migration on an empty database, proves idempotency (second
  # deploy = no pending), validates the schema, and runs a real SERIALIZABLE
  # concurrency rehearsal proving two simultaneous reservations cannot exceed a
  # configured ceiling. Credentials are DISPOSABLE, CI-only, reach only a
  # localhost service container, and cannot touch production or staging. No
  # secrets, no SSH, read-only repo permissions (inherited), a job timeout, a DB
  # health check, and NO continue-on-error.
  # ---------------------------------------------------------------------------
  phase96-postgres:
    name: Phase 96 PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://hermes_ci:phase96-ci-only-password@localhost:5432/hermes_phase96_ci
      HERMES_STORAGE_MODE: database
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hermes_ci
          POSTGRES_PASSWORD: phase96-ci-only-password
          POSTGRES_DB: hermes_phase96_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes_ci -d hermes_phase96_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Fresh migration rehearsal (prisma migrate deploy on an empty database)
        run: npx --no-install prisma migrate deploy

      - name: Idempotency — a second deploy must report no pending migrations
        run: |
          npx --no-install prisma migrate deploy
          npx --no-install prisma migrate status

      - name: Validate Prisma schema against the migrated database
        run: npm run db:validate

      - name: SERIALIZABLE seat-limit concurrency rehearsal
        run: node scripts/ci/phase96-concurrency-rehearsal.mjs
