# Legacy master deployment is permanently disabled.
#
# The canonical, protected manual Production Deploy workflow lives on main.
# This stub intentionally retains workflow_dispatch so selecting the legacy
# master ref cannot execute any SSH, Docker or deployment operation.

name: Legacy Production Deploy Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    name: Refuse deployment from legacy master
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Block legacy deployment
        run: |
          echo "::error::Deployment from legacy master is disabled. Use the protected Production Deploy workflow on canonical main."
          exit 1
