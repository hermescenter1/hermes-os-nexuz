# Production deployment — MANUAL ONLY (Gate 0A safety contract).
#
# - No push trigger: merging to main never deploys by itself.
# - workflow_dispatch requires an exact 40-hex commit SHA plus the literal
#   confirmation phrase, and runs in the protected "production" environment
#   (required reviewers are configured in repository settings, not here).
# - The selected commit must already be part of approved main history,
#   verified both on the runner and again on the server.
# - SSH trusts only the pinned host key from the SSH_KNOWN_HOSTS secret;
#   runtime ssh-keyscan is forbidden. SSH_PORT is optional (default 22) and
#   validated before use; for a non-default port the pinned known_hosts line
#   must use the matching "[host]:port" form.
# - The remote operator must be the documented non-root deploy user.
# - The server checks out the exact SHA (no unbounded git pull) and rebuilds
#   only the hermes-web service: postgres, redis, nginx, named volumes and the
#   host itself are never stopped, recreated, pruned or restarted.
# - Every Compose command pins the canonical Production project with
#   "-p hermes" (Gate 0D-A): the project name must never be derived from the
#   checkout directory, which once created a second empty "hermes-os-nexuz"
#   stack beside the real one.
#
# PHASE 99.7 — migration-bearing releases are gated AND explicitly migrated.
#
# Until Phase 99.7 this workflow rebuilt hermes-web and nothing else. That is
# correct for an app-only release and DANGEROUS for one carrying schema
# migrations, because NOTHING applies them: the runner image's CMD is only
# `node server.js` (no on-boot migration), and docker-compose.prod.yml documents
# migrations as a separate pre-start operation. A migration-bearing release
# deployed by the old workflow would boot new code against the old schema.
#
# What is now enforced, fail-closed, WITHOUT adding any automatic deployment and
# without granting this workflow any access it did not already have:
#   - the operator must declare the SHA currently running in Production
#     (`deployed_sha`), and it must be an ancestor of the target;
#   - the runner computes the migration delta between the two commits from the
#     repository alone and refuses on historical mutation or an unclassifiable
#     migration;
#   - when migrations DO ship, the deploy refuses unless the operator supplies
#     the second confirmation phrase AND the production host itself proves, with
#     POSIX tools only, that the newest encrypted backup is complete, verified
#     and hash-intact, and that the documents_data adoption evidence exists;
#   - the server worktree must be CLEAN before checkout, and after checkout the
#     build context is proven to be exactly TARGET_SHA (HEAD match + clean);
#   - a missing previous-good image is a HARD failure, and the preserved
#     `hermes-web:previous-good` tag is verified to resolve to exactly the
#     pre-cutover image ID before anything is rebuilt;
#   - every Compose invocation passes `--env-file .env.production`, so the
#     NEXT_PUBLIC_* build args interpolate from the canonical env file instead
#     of silently falling back to empty defaults;
#   - migrations are applied EXPLICITLY, before hermes-web is replaced, by the
#     pinned target-derived migrator (`--profile migrate run hermes-migrate`,
#     built from the same checkout via the Dockerfile `migrator` stage — never
#     a network-fetched CLI), then verified: `migrate status` must exit clean
#     and the applied-migration count must equal the target commit's count.
#
# What is deliberately NOT done here: no database restore, ever. Rolling the
# application back and recovering the database are separate, human-decided
# operations (see docs/release/phase99.7-production-cutover-contract.md).

name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA on main to deploy"
        required: true
        type: string
      deployed_sha:
        description: "Exact 40-character commit SHA currently running in production"
        required: true
        type: string
      confirm:
        description: 'Type "deploy-to-production" to confirm'
        required: true
        type: string
      migration_prerequisites:
        description: 'Required ONLY when the release carries migrations: type "migration-prerequisites-verified"'
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pinned commit to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy-to-production" ]; then
            echo "Confirmation phrase mismatch — refusing to deploy." >&2
            exit 1
          fi

      - name: Validate commit SHA format
        run: |
          # Whole-string check (not line-based): rejects any non-hex byte,
          # including whitespace and newlines, and enforces exact length 40.
          for pair in "commit_sha:$TARGET_SHA" "deployed_sha:$DEPLOYED_SHA"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            case "$value" in
              *[!0-9a-f]*|'')
                echo "${name} must be an exact 40-character lowercase hex SHA." >&2
                exit 1
                ;;
            esac
            if [ "${#value}" -ne 40 ]; then
              echo "${name} must be an exact 40-character lowercase hex SHA." >&2
              exit 1
            fi
          done

      - name: Check out main history (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit belongs to approved main history
        run: |
          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "Refusing: ${TARGET_SHA} is not a commit reachable from main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "Refusing: ${TARGET_SHA} is not an ancestor of main." >&2
            exit 1
          fi
          if ! git cat-file -e "${DEPLOYED_SHA}^{commit}"; then
            echo "Refusing: deployed_sha ${DEPLOYED_SHA} is not a commit in this repository." >&2
            exit 1
          fi
          # Deploying "forward" means the currently-running commit is an
          # ancestor of the target. Anything else is a rollback or a divergent
          # history and must not go through this path.
          if ! git merge-base --is-ancestor "$DEPLOYED_SHA" "$TARGET_SHA"; then
            echo "Refusing: deployed_sha ${DEPLOYED_SHA} is not an ancestor of the target ${TARGET_SHA}." >&2
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Repository-only computation: reads two commits out of git history and
      # classifies the migration delta. No install, no network, no host contact.
      - name: Classify the migration delta this release carries
        id: migration
        run: node scripts/dr/deploy-migration-gate.mjs

      # The evidence requirement is derived from the classification above, so an
      # operator cannot opt out of it by leaving the input blank.
      - name: Require migration prerequisites when the release carries migrations
        env:
          MIGRATION_PREREQUISITES: ${{ inputs.migration_prerequisites }}
          BACKUP_REQUIRED: ${{ steps.migration.outputs.pre_migration_backup_required }}
        run: |
          if [ "$BACKUP_REQUIRED" != "true" ]; then
            echo "No migration ships with this release — the pre-migration evidence gate does not apply."
            exit 0
          fi
          if [ "$MIGRATION_PREREQUISITES" != "migration-prerequisites-verified" ]; then
            echo "Refusing: this release carries migrations." >&2
            echo "Complete the Phase 99.7 cutover contract (verified encrypted backup," >&2
            echo "documents_data adoption, migration rehearsal, candidate gate) and re-run" >&2
            echo 'with migration_prerequisites = "migration-prerequisites-verified".' >&2
            exit 1
          fi

      - name: Validate connection configuration
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SERVER_IP" ]; then
            echo "SERVER_IP secret is required (fail closed)." >&2
            exit 1
          fi
          if [ -z "$SERVER_USER" ] || [ "$SERVER_USER" = "root" ]; then
            echo "SERVER_USER must be the documented non-root production operator." >&2
            exit 1
          fi
          # SSH_PORT is optional; default 22. Whole-string integer check, then
          # range check (length guard first so the numeric test cannot overflow).
          PORT="${SSH_PORT:-22}"
          case "$PORT" in
            *[!0-9]*|'')
              echo "SSH_PORT must be an integer between 1 and 65535." >&2
              exit 1
              ;;
          esac
          if [ "${#PORT}" -gt 5 ] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "SSH_PORT must be an integer between 1 and 65535." >&2
            exit 1
          fi

      - name: Install SSH key and pinned host trust
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KEY and SSH_KNOWN_HOSTS secrets are required (fail closed)." >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          # Normalize CRLF line endings that UI copy/paste can introduce, then
          # prove the key is a usable unencrypted private key before any use.
          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "SSH_KEY is not a valid unencrypted private key." >&2
            exit 1
          fi
          # Host trust comes exclusively from this pinned secret — never from
          # runtime scanning. Use "[host]:port" entries for a non-default port.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy the pinned commit (migrate, then targeted hermes-web rebuild)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          BACKUP_REQUIRED: ${{ steps.migration.outputs.pre_migration_backup_required }}
          TARGET_MIGRATION_COUNT: ${{ steps.migration.outputs.target_migration_count }}
        run: |
          # The expected applied-migration count comes from the runner's git-only
          # classification step; refuse to proceed without a sane integer.
          case "$TARGET_MIGRATION_COUNT" in
            *[!0-9]*|'')
              echo "TARGET_MIGRATION_COUNT must be a non-negative integer (fail closed)." >&2
              exit 1
              ;;
          esac
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy \
              -p "$PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              "${SERVER_USER}@${SERVER_IP}" \
              "TARGET_SHA=${TARGET_SHA} BACKUP_REQUIRED=${BACKUP_REQUIRED} TARGET_MIGRATION_COUNT=${TARGET_MIGRATION_COUNT} bash -s" <<'REMOTE'
          set -euo pipefail
          unset DOCKER_HOST

          if [ "$(id -u)" -eq 0 ]; then
            echo "Refusing to deploy as root on the production host." >&2
            exit 1
          fi

          cd /opt/hermes-os-nexuz

          # The canonical env file drives both container runtime env AND compose
          # ${VAR} interpolation (NEXT_PUBLIC_* build args). Refuse without it —
          # a build without it would silently bake empty analytics/SEO values.
          if [ ! -f .env.production ]; then
            echo "Refusing: /opt/hermes-os-nexuz/.env.production is missing." >&2
            exit 1
          fi

          git fetch --prune origin
          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "Refusing: ${TARGET_SHA} is unknown on the server after fetch." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Refusing: ${TARGET_SHA} is not on origin/main." >&2
            exit 1
          fi

          # ── Fail closed on a dirty server worktree BEFORE checkout/build ─────
          # Local modifications would silently leak into the build context and
          # the deployed image would no longer correspond to TARGET_SHA.
          # (.env.production and backups are gitignored / outside the repo, so
          # they never appear here.)
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing: the server worktree at /opt/hermes-os-nexuz is dirty:" >&2
            git status --porcelain >&2
            exit 1
          fi

          # ── PHASE 99.7 pre-migration evidence gate (POSIX tools only) ────────
          # Runs on the host that owns the data, BEFORE anything is rebuilt.
          # Read-only: it inspects the backup directory and never writes,
          # rotates, prunes or decrypts anything, and never prints key material.
          if [ "${BACKUP_REQUIRED}" = "true" ]; then
            BACKUP_DIR="${BACKUP_DIR:-/backups/postgres}"
            ADOPTION_EVIDENCE="${BACKUP_DIR}/documents-adoption.json"

            NEWEST_BACKUP="$(ls -1t "${BACKUP_DIR}"/*.hbk 2>/dev/null | head -n 1 || true)"
            if [ -z "${NEWEST_BACKUP}" ]; then
              echo "Refusing: no encrypted backup (.hbk) found in ${BACKUP_DIR}." >&2
              exit 1
            fi
            if [ -e "${NEWEST_BACKUP}.partial" ]; then
              echo "Refusing: ${NEWEST_BACKUP} has a .partial sibling — the atomic publish never completed." >&2
              exit 1
            fi

            META="${NEWEST_BACKUP}.meta.json"
            if [ ! -f "${META}" ]; then
              echo "Refusing: no verification record beside ${NEWEST_BACKUP}." >&2
              exit 1
            fi
            # The record is a single-line JSON document written by
            # scripts/backup-postgres.sh; match the exact literal fields.
            grep -q '"verified":true'  "${META}" || { echo "Refusing: newest backup is not marked verified." >&2; exit 1; }
            grep -q '"partial":false'  "${META}" || { echo "Refusing: newest backup is not marked complete." >&2; exit 1; }
            grep -q '"encrypted":true' "${META}" || { echo "Refusing: newest backup is not marked encrypted." >&2; exit 1; }

            RECORDED_SHA="$(sed -n 's/.*"transportSha256":"\([0-9a-f]\{64\}\)".*/\1/p' "${META}")"
            if [ -z "${RECORDED_SHA}" ]; then
              echo "Refusing: verification record carries no transport SHA-256." >&2
              exit 1
            fi
            ACTUAL_SHA="$(sha256sum "${NEWEST_BACKUP}" | cut -d' ' -f1)"
            if [ "${ACTUAL_SHA}" != "${RECORDED_SHA}" ]; then
              echo "Refusing: backup integrity check failed for ${NEWEST_BACKUP}." >&2
              exit 1
            fi

            # documents_data adoption evidence (written by
            # scripts/dr/adopt-documents.mjs --manifest-out).
            if [ ! -f "${ADOPTION_EVIDENCE}" ]; then
              echo "Refusing: no documents_data adoption evidence at ${ADOPTION_EVIDENCE}." >&2
              exit 1
            fi
            grep -q '"integrityVerified": *true' "${ADOPTION_EVIDENCE}" || {
              echo "Refusing: documents_data adoption evidence does not prove integrity." >&2
              exit 1
            }

            echo "Pre-migration evidence verified: $(basename "${NEWEST_BACKUP}") complete, verified and hash-intact."
          fi

          # ── Preserve the previous-good image BEFORE rebuilding (HARD gate) ───
          # A rollback target must exist before the thing being rolled back from
          # is created. Tagging is additive: no image is removed or pruned. A
          # missing running image is a REFUSAL, not a warning — a deploy with no
          # rollback target must never proceed through this workflow.
          RUNNING_WEB="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production ps -q hermes-web | head -n 1 || true)"
          if [ -z "${RUNNING_WEB}" ]; then
            echo "Refusing: no running hermes-web container found — no previous-good rollback target exists." >&2
            exit 1
          fi
          PREVIOUS_IMAGE_ID="$(docker inspect -f '{{.Image}}' "${RUNNING_WEB}")"
          if [ -z "${PREVIOUS_IMAGE_ID}" ]; then
            echo "Refusing: could not resolve the running hermes-web image ID." >&2
            exit 1
          fi
          docker image tag "${PREVIOUS_IMAGE_ID}" "hermes-web:previous-good"
          PRESERVED_ID="$(docker image inspect -f '{{.Id}}' "hermes-web:previous-good")"
          if [ "${PRESERVED_ID}" != "${PREVIOUS_IMAGE_ID}" ]; then
            echo "Refusing: hermes-web:previous-good (${PRESERVED_ID}) does not resolve to the pre-cutover image (${PREVIOUS_IMAGE_ID})." >&2
            exit 1
          fi
          echo "Previous-good image preserved and verified: hermes-web:previous-good -> ${PREVIOUS_IMAGE_ID}"

          git checkout --detach "$TARGET_SHA"

          # ── Prove the build context IS the pinned target ─────────────────────
          if [ "$(git rev-parse HEAD)" != "${TARGET_SHA}" ]; then
            echo "Refusing: post-checkout HEAD does not equal TARGET_SHA." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing: the worktree is dirty after checkout — the build context would not be ${TARGET_SHA}." >&2
            exit 1
          fi

          # ── Build the release from the proven context ────────────────────────
          # --env-file .env.production is REQUIRED here: the NEXT_PUBLIC_* build
          # args interpolate from it; omitting it silently bakes empty values.
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production build hermes-web

          # ── Apply migrations EXPLICITLY, before replacing hermes-web ─────────
          # The runner image never migrates (CMD is `node server.js`), so a
          # migration-bearing release must run the pinned target-derived
          # migrator: the Dockerfile `migrator` stage, built from this exact
          # checkout, whose Prisma CLI version comes from this checkout's own
          # lockfile. Profile-gated: `up -d` never starts it.
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production --profile migrate build hermes-migrate
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production --profile migrate run --rm -T hermes-migrate

          # ── Verify the migration outcome (fail closed) ───────────────────────
          # 1. `migrate status` exits non-zero while ANY migration is pending.
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production --profile migrate run --rm -T hermes-migrate \
            node node_modules/prisma/build/index.js migrate status
          # 2. The applied count must equal the target commit's migration count
          #    (computed on the runner from git), and no row may be unfinished
          #    or rolled back.
          APPLIED_COUNT="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production exec -T postgres \
            sh -c 'psql -U "${POSTGRES_USER:-hermes}" -d "${POSTGRES_DB:-hermes_db}" -tAc "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL"' | tr -d '[:space:]')"
          FAILED_COUNT="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production exec -T postgres \
            sh -c 'psql -U "${POSTGRES_USER:-hermes}" -d "${POSTGRES_DB:-hermes_db}" -tAc "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL"' | tr -d '[:space:]')"
          if [ "${APPLIED_COUNT}" != "${TARGET_MIGRATION_COUNT}" ]; then
            echo "Refusing to replace hermes-web: applied migration count ${APPLIED_COUNT} != expected ${TARGET_MIGRATION_COUNT}." >&2
            exit 1
          fi
          if [ "${FAILED_COUNT}" != "0" ]; then
            echo "Refusing to replace hermes-web: ${FAILED_COUNT} migration row(s) are unfinished or rolled back." >&2
            exit 1
          fi
          echo "Migrations verified: ${APPLIED_COUNT}/${TARGET_MIGRATION_COUNT} applied, 0 failed."
          # NOTE: a migration failure above stops the deploy with the previous
          # release still serving traffic. It is NEVER answered by an automatic
          # database restore — recovery is a separate human-decided operation.

          # ── Replace ONLY hermes-web (image already built above) ──────────────
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production up -d --no-deps hermes-web
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production ps hermes-web
          REMOTE

      # Gate 0D-A (scripts/production-compose-project-static-check.mjs) is the
      # authority on the shape of every command above. Running it here as well
      # means a change to this workflow cannot reach a deploy attempt without
      # first satisfying the same static contract CI enforces on pull requests.
      - name: Re-assert the production Compose contract (Gate 0D-A)
        if: always()
        run: node scripts/production-compose-project-static-check.mjs
