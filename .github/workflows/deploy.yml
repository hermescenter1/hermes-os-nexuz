# Production deployment — MANUAL ONLY (Gate 0A safety contract).
#
# - No push trigger: merging to main never deploys by itself.
# - workflow_dispatch requires an exact 40-hex commit SHA plus the literal
#   confirmation phrase, and runs in the protected "production" environment
#   (required reviewers are configured in repository settings, not here).
# - The selected commit must already be part of approved main history,
#   verified both on the runner and again on the server.
# - SSH trusts only the pinned host key from the SSH_KNOWN_HOSTS secret;
#   runtime ssh-keyscan is forbidden. SSH_PORT is optional (default 22) and
#   validated before use; for a non-default port the pinned known_hosts line
#   must use the matching "[host]:port" form.
# - The remote operator must be the documented non-root deploy user.
# - The server checks out the exact SHA (no unbounded git pull) and rebuilds
#   only the hermes-web service: postgres, redis, nginx, named volumes and the
#   host itself are never stopped, recreated, pruned or restarted.
# - Every Compose command pins the canonical Production project with
#   "-p hermes" (Gate 0D-A): the project name must never be derived from the
#   checkout directory, which once created a second empty "hermes-os-nexuz"
#   stack beside the real one.
#
# PHASE 99.7 — migration-bearing releases are gated AND explicitly migrated.
#
# Until Phase 99.7 this workflow rebuilt hermes-web and nothing else. That is
# correct for an app-only release and DANGEROUS for one carrying schema
# migrations, because NOTHING applies them: the runner image's CMD is only
# `node server.js` (no on-boot migration), and docker-compose.prod.yml documents
# migrations as a separate pre-start operation. A migration-bearing release
# deployed by the old workflow would boot new code against the old schema.
#
# What is now enforced, fail-closed, WITHOUT adding any automatic deployment and
# without granting this workflow any access it did not already have:
#   - the operator must declare the SHA currently running in Production
#     (`deployed_sha`), and it must be an ancestor of the target;
#   - the runner computes the migration delta between the two commits from the
#     repository alone and refuses on historical mutation or an unclassifiable
#     migration;
#   - when migrations DO ship, the deploy refuses unless the operator supplies
#     the second confirmation phrase AND the production host itself proves, with
#     standard shell tools only (no jq) and read-only `sudo -n` access to the
#     root-owned backup directory, that the newest encrypted backup is complete,
#     verified and hash-intact, and that the documents_data adoption evidence
#     exists;
#   - the server worktree must be CLEAN before checkout, and after checkout the
#     build context is proven to be exactly TARGET_SHA (HEAD match + clean);
#   - a missing previous-good image is a HARD failure, and the preserved
#     `hermes-web:previous-good` tag is verified to resolve to exactly the
#     pre-cutover image ID before anything is rebuilt;
#   - every Compose invocation passes `--env-file .env.production`, so the
#     NEXT_PUBLIC_* build args interpolate from the canonical env file instead
#     of silently falling back to empty defaults;
#   - migrations are applied EXPLICITLY, before hermes-web is replaced, by the
#     pinned target-derived migrator (`--profile migrate run hermes-migrate`,
#     built from the same checkout via the Dockerfile `migrator` stage — never
#     a network-fetched CLI), then verified: `migrate status` must exit clean
#     and the applied-migration count must equal the target commit's count.
#
# What is deliberately NOT done here: no database restore, ever. Rolling the
# application back and recovering the database are separate, human-decided
# operations (see docs/release/phase99.7-production-cutover-contract.md).
#
# POST-DEPLOY HEALTH GATE — "the container started" is not "the release is healthy".
#
# `up -d` returns once the new hermes-web container is STARTED, long before its
# first health probe (docker-compose.prod.yml: start_period 45s, interval 30s).
# The workflow used to print one `ps` snapshot — normally "(health: starting)" —
# and finish green, so a release that crash-looped, never turned healthy or could
# not reach PostgreSQL still read as a successful deploy. The gate at the end of
# the remote script now, within a bounded time:
#   - waits for the container's own healthcheck to report "healthy";
#   - requires the container to be running, not restarting, with RestartCount 0;
#   - asks /api/health/ready from inside the container for exactly
#     status "ready" with database true (PostgreSQL reachable);
#   - fails the job on unhealthy, a restart loop, a timeout or any other answer.
# On failure it prints validated state fields only — never container logs, never a
# response body. It changes NOTHING: no restart, no rebuild, no image tag, no
# migration, no automatic rollback. `hermes-web:previous-good` remains the
# rollback target and using it stays a separate, human-decided operation.

name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA on main to deploy"
        required: true
        type: string
      deployed_sha:
        description: "Exact 40-character commit SHA currently running in production"
        required: true
        type: string
      confirm:
        description: 'Type "deploy-to-production" to confirm'
        required: true
        type: string
      migration_prerequisites:
        description: 'Required ONLY when the release carries migrations: type "migration-prerequisites-verified"'
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pinned commit to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy-to-production" ]; then
            echo "Confirmation phrase mismatch — refusing to deploy." >&2
            exit 1
          fi

      - name: Validate commit SHA format
        run: |
          # Whole-string check (not line-based): rejects any non-hex byte,
          # including whitespace and newlines, and enforces exact length 40.
          for pair in "commit_sha:$TARGET_SHA" "deployed_sha:$DEPLOYED_SHA"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            case "$value" in
              *[!0-9a-f]*|'')
                echo "${name} must be an exact 40-character lowercase hex SHA." >&2
                exit 1
                ;;
            esac
            if [ "${#value}" -ne 40 ]; then
              echo "${name} must be an exact 40-character lowercase hex SHA." >&2
              exit 1
            fi
          done

      - name: Check out main history (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit belongs to approved main history
        run: |
          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "Refusing: ${TARGET_SHA} is not a commit reachable from main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "Refusing: ${TARGET_SHA} is not an ancestor of main." >&2
            exit 1
          fi
          if ! git cat-file -e "${DEPLOYED_SHA}^{commit}"; then
            echo "Refusing: deployed_sha ${DEPLOYED_SHA} is not a commit in this repository." >&2
            exit 1
          fi
          # Deploying "forward" means the currently-running commit is an
          # ancestor of the target. Anything else is a rollback or a divergent
          # history and must not go through this path.
          if ! git merge-base --is-ancestor "$DEPLOYED_SHA" "$TARGET_SHA"; then
            echo "Refusing: deployed_sha ${DEPLOYED_SHA} is not an ancestor of the target ${TARGET_SHA}." >&2
            exit 1
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Repository-only computation: reads two commits out of git history and
      # classifies the migration delta. No install, no network, no host contact.
      - name: Classify the migration delta this release carries
        id: migration
        run: node scripts/dr/deploy-migration-gate.mjs

      # The evidence requirement is derived from the classification above, so an
      # operator cannot opt out of it by leaving the input blank.
      - name: Require migration prerequisites when the release carries migrations
        env:
          MIGRATION_PREREQUISITES: ${{ inputs.migration_prerequisites }}
          BACKUP_REQUIRED: ${{ steps.migration.outputs.pre_migration_backup_required }}
        run: |
          if [ "$BACKUP_REQUIRED" != "true" ]; then
            echo "No migration ships with this release — the pre-migration evidence gate does not apply."
            exit 0
          fi
          if [ "$MIGRATION_PREREQUISITES" != "migration-prerequisites-verified" ]; then
            echo "Refusing: this release carries migrations." >&2
            echo "Complete the Phase 99.7 cutover contract (verified encrypted backup," >&2
            echo "documents_data adoption, migration rehearsal, candidate gate) and re-run" >&2
            echo 'with migration_prerequisites = "migration-prerequisites-verified".' >&2
            exit 1
          fi

      - name: Validate connection configuration
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SERVER_IP" ]; then
            echo "SERVER_IP secret is required (fail closed)." >&2
            exit 1
          fi
          if [ -z "$SERVER_USER" ] || [ "$SERVER_USER" = "root" ]; then
            echo "SERVER_USER must be the documented non-root production operator." >&2
            exit 1
          fi
          # SSH_PORT is optional; default 22. Whole-string integer check, then
          # range check (length guard first so the numeric test cannot overflow).
          PORT="${SSH_PORT:-22}"
          case "$PORT" in
            *[!0-9]*|'')
              echo "SSH_PORT must be an integer between 1 and 65535." >&2
              exit 1
              ;;
          esac
          if [ "${#PORT}" -gt 5 ] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "SSH_PORT must be an integer between 1 and 65535." >&2
            exit 1
          fi

      - name: Install SSH key and pinned host trust
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KEY and SSH_KNOWN_HOSTS secrets are required (fail closed)." >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          # Normalize CRLF line endings that UI copy/paste can introduce, then
          # prove the key is a usable unencrypted private key before any use.
          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "SSH_KEY is not a valid unencrypted private key." >&2
            exit 1
          fi
          # Host trust comes exclusively from this pinned secret — never from
          # runtime scanning. Use "[host]:port" entries for a non-default port.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # ── DA-1 · the release backup evidence gate, as its own step ──────────
      #
      # It is a SEPARATE STEP, not a block at the top of the deploy script,
      # because line order inside one step is not a guarantee anyone can read
      # off the workflow. A failure here fails the job, and every step after
      # it — the deploy, every git write, every build, the migrator and the
      # service replacement — is skipped by Actions' own semantics.
      #
      # It is also the reason the judgement moved to the runner. At this
      # point the host's working tree is still the PREVIOUSLY deployed
      # commit, so a helper read from there would be the previous release's
      # helper, or missing. The one that runs comes from this checkout.
      - name: Evaluate the production backup evidence (read-only)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # Whether this release carries a migration. It decides only whether
          # documents_data CUTOVER evidence is also required; it does not and
          # must not decide whether backup evidence is required.
          BACKUP_REQUIRED: ${{ steps.migration.outputs.pre_migration_backup_required }}
          # Independent of the migration delta, and a LITERAL: no
          # classification output and no dispatch input can evaluate it away.
          # Every production release needs a usable restore point, because
          # every production release might have to be rolled back.
          RELEASE_BACKUP_EVIDENCE_REQUIRED: "true"
        run: |
          case "${RELEASE_BACKUP_EVIDENCE_REQUIRED:-}" in
            true) ;;
            *)
              echo "Refusing: backup evidence is mandatory for every production release; RELEASE_BACKUP_EVIDENCE_REQUIRED was not true." >&2
              exit 1
              ;;
          esac

          # The runner must be judging the commit being released, not
          # whatever main happened to be when the job started.
          if [ "$(git rev-parse HEAD)" != "${TARGET_SHA}" ]; then
            git checkout --detach "${TARGET_SHA}"
          fi
          if [ "$(git rev-parse HEAD)" != "${TARGET_SHA}" ]; then
            echo "Refusing: the runner checkout is not ${TARGET_SHA}; the evidence would be judged by the wrong rules." >&2
            exit 1
          fi

          PORT="${SSH_PORT:-22}"
          # READ-ONLY. The collector is streamed in on stdin, so nothing is
          # written to the host, and it is NOT run under `sudo bash` — each
          # read goes through a narrow `sudo -n -- <binary>` form. NOTE: the
          # deploy account currently holds NOPASSWD:ALL on the host
          # (DEPLOY_USER_NOPASSWD_ALL, 2026-10-16), so that narrowness is
          # this caller's discipline, not a limit the system enforces.
          # Its stdout is captured; its stderr is left on the terminal so a
          # refusal is visible without being mistaken for evidence.
          set +e
          EVIDENCE="$(ssh -i ~/.ssh/id_deploy \
              -p "$PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              "${SERVER_USER}@${SERVER_IP}" \
              "COLLECT_ADOPTION=${BACKUP_REQUIRED} bash -s" < scripts/deploy/collect-backup-evidence.sh)"
          SSH_STATUS=$?
          set -e
          if [ "${SSH_STATUS}" -ne 0 ]; then
            echo "Refusing: the read-only evidence collection failed (ssh exit ${SSH_STATUS})." >&2
            echo "No evidence means no release: nothing has been changed on the host." >&2
            exit 1
          fi

          # One implementation of the verdict, from THIS checkout.
          printf '%s' "${EVIDENCE}" \
            | REQUIRE_ADOPTION="${BACKUP_REQUIRED}" bash scripts/deploy/evaluate-backup-evidence.sh

      - name: Deploy the pinned commit (migrate, then targeted hermes-web rebuild)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          BACKUP_REQUIRED: ${{ steps.migration.outputs.pre_migration_backup_required }}
          # Independent of the migration delta ON PURPOSE. BACKUP_REQUIRED
          # answers "does this release carry a migration" and must keep
          # answering only that. This answers a different question: may a
          # production release proceed at all without a usable restore
          # point? For every production deploy the answer is no. It is a
          # literal, not an expression, so no classification outcome and no
          # dispatch input can turn it off.
          TARGET_MIGRATION_COUNT: ${{ steps.migration.outputs.target_migration_count }}
        run: |
          # The expected applied-migration count comes from the runner's git-only
          # classification step; refuse to proceed without a sane integer.
          case "$TARGET_MIGRATION_COUNT" in
            *[!0-9]*|'')
              echo "TARGET_MIGRATION_COUNT must be a non-negative integer (fail closed)." >&2
              exit 1
              ;;
          esac
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy \
              -p "$PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              "${SERVER_USER}@${SERVER_IP}" \
              "TARGET_SHA=${TARGET_SHA} BACKUP_REQUIRED=${BACKUP_REQUIRED} TARGET_MIGRATION_COUNT=${TARGET_MIGRATION_COUNT} bash -s" <<'REMOTE'
          set -euo pipefail
          unset DOCKER_HOST

          if [ "$(id -u)" -eq 0 ]; then
            echo "Refusing to deploy as root on the production host." >&2
            exit 1
          fi

          cd /opt/hermes-os-nexuz

          # The canonical env file drives both container runtime env AND compose
          # ${VAR} interpolation (NEXT_PUBLIC_* build args). Refuse without it —
          # a build without it would silently bake empty analytics/SEO values.
          if [ ! -f .env.production ]; then
            echo "Refusing: /opt/hermes-os-nexuz/.env.production is missing." >&2
            exit 1
          fi

          # This is the ONE persistent host operation that precedes the backup
          # evidence gate, and it is here deliberately: the target SHA has to
          # be proven to exist on origin/main before anything else is
          # attempted. It writes to the object store and moves
          # remote-tracking refs, so it is not read-only — but it changes no
          # service, no image, no container and no data, and the working tree
          # it leaves behind is the one already deployed.
          #
          # Everything that touches the running system — the working-tree
          # move, the previous-good tag, both image builds, the migrator and
          # the service replacement — happens after the gate. That ordering is
          # pinned in scripts/__tests__/backup-freshness-gate.test.ts.
          git fetch --prune origin
          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "Refusing: ${TARGET_SHA} is unknown on the server after fetch." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Refusing: ${TARGET_SHA} is not on origin/main." >&2
            exit 1
          fi

          # ── Fail closed on a dirty server worktree BEFORE checkout/build ─────
          # Local modifications would silently leak into the build context and
          # the deployed image would no longer correspond to TARGET_SHA.
          # (.env.production and backups are gitignored / outside the repo, so
          # they never appear here.)
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing: the server worktree at /opt/hermes-os-nexuz is dirty:" >&2
            git status --porcelain >&2
            exit 1
          fi

          # ── PHASE 99.7 pre-migration evidence gate ──────────────────────────
          # Runs on the host that owns the data, BEFORE anything is rebuilt.
          # Read-only: it inspects the backup directory and never writes,
          # rotates, prunes or decrypts anything, and never prints key material.
          #
          # PRIVILEGED READS. scripts/backup-postgres.sh runs with `umask 077`,
          # `chmod 700` on the backup directory and `chmod 600` on every file,
          # so the official .hbk and its .meta.json are root-owned and unreadable
          # by this (deliberately non-root) deploy user. The first cut of this
          # gate read them without privilege: grep hit "Permission denied" and
          # the gate refused a genuinely verified backup as "not marked
          # verified". Closed, but unpassable. Every read of the backup
          # directory now goes through `sudo -n`, and ONLY reads do:
          #   find (list, select newest, check type), cat (the two small JSON
          #   records), sha256sum (the .hbk). Nothing is chmod'ed, copied, or
          #   printed, and the verification rules are unchanged.
          # `-n` because this runs over `ssh -o BatchMode=yes` with no TTY: a
          # missing sudoers rule fails immediately instead of hanging on a
          # password prompt. The deploy user therefore needs NOPASSWD for exactly
          # those four read-only binaries (see the Phase 99.7 cutover contract).
          #
          # FAIL CLOSED. Every privileged call is checked for its OWN exit
          # status, so "sudo was denied" can never read as "no .partial file" or
          # as a matching hash. JSON is matched with here-strings, not
          # `printf | grep -q`: under pipefail an early-exiting grep can SIGPIPE
          # the writer and turn a match into a refusal (Phase 93.2).
          #
          # POSIX shell and coreutils/findutils only: `jq` is NOT used, because
          # nothing on this host is known to provide it and a gate that depends
          # on an absent tool would refuse every migration-bearing deploy.
          # The backup evidence gate is NOT here any more. It runs as its
          # own step, before this one, so a release with an unusable
          # restore point never reaches a step that can change anything.
          # See "Evaluate the production backup evidence" above.

          # ── Preserve the previous-good image BEFORE rebuilding (HARD gate) ───
          # A rollback target must exist before the thing being rolled back from
          # is created. Tagging is additive: no image is removed or pruned. A
          # missing running image is a REFUSAL, not a warning — a deploy with no
          # rollback target must never proceed through this workflow.
          RUNNING_WEB="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production ps -q hermes-web | head -n 1 || true)"
          if [ -z "${RUNNING_WEB}" ]; then
            echo "Refusing: no running hermes-web container found — no previous-good rollback target exists." >&2
            exit 1
          fi
          PREVIOUS_IMAGE_ID="$(docker inspect -f '{{.Image}}' "${RUNNING_WEB}")"
          if [ -z "${PREVIOUS_IMAGE_ID}" ]; then
            echo "Refusing: could not resolve the running hermes-web image ID." >&2
            exit 1
          fi
          docker image tag "${PREVIOUS_IMAGE_ID}" "hermes-web:previous-good"
          PRESERVED_ID="$(docker image inspect -f '{{.Id}}' "hermes-web:previous-good")"
          if [ "${PRESERVED_ID}" != "${PREVIOUS_IMAGE_ID}" ]; then
            echo "Refusing: hermes-web:previous-good (${PRESERVED_ID}) does not resolve to the pre-cutover image (${PREVIOUS_IMAGE_ID})." >&2
            exit 1
          fi
          echo "Previous-good image preserved and verified: hermes-web:previous-good -> ${PREVIOUS_IMAGE_ID}"


          git checkout --detach "$TARGET_SHA"

          # ── Prove the build context IS the pinned target ─────────────────────
          if [ "$(git rev-parse HEAD)" != "${TARGET_SHA}" ]; then
            echo "Refusing: post-checkout HEAD does not equal TARGET_SHA." >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "Refusing: the worktree is dirty after checkout — the build context would not be ${TARGET_SHA}." >&2
            exit 1
          fi

          # ── Build the release from the proven context ────────────────────────
          # --env-file .env.production is REQUIRED here: the NEXT_PUBLIC_* build
          # args interpolate from it; omitting it silently bakes empty values.
          #
          # GIT_REVISION (DA-3) stamps the commit into the image as the standard
          # OCI label, so the ARTEFACT can later be matched against the SHA this
          # run deployed. Exported rather than put in the env file: it changes
          # every release and belongs to the run, not to the host's config.
          export GIT_REVISION="${TARGET_SHA}"
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production build hermes-web

          # ── Apply migrations EXPLICITLY, before replacing hermes-web ─────────
          # The runner image never migrates (CMD is `node server.js`), so a
          # migration-bearing release must run the pinned target-derived
          # migrator: the Dockerfile `migrator` stage, built from this exact
          # checkout, whose Prisma CLI version comes from this checkout's own
          # lockfile. Profile-gated: `up -d` never starts it.
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production --profile migrate build hermes-migrate
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production --profile migrate run --rm -T hermes-migrate </dev/null

          # ── Verify the migration outcome (fail closed) ───────────────────────
          # 1. `migrate status` exits non-zero while ANY migration is pending.
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production --profile migrate run --rm -T hermes-migrate \
            node node_modules/prisma/build/index.js migrate status </dev/null
          # 2. The applied count must equal the target commit's migration count
          #    (computed on the runner from git), and no row may be unfinished
          #    and no unresolved migration attempt may remain. Historical attempts
          #    explicitly resolved as rolled back are retained by Prisma for audit history
          #    and must not be treated as an active failure.
          APPLIED_COUNT="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production exec -T postgres \
            sh -c 'psql -U "${POSTGRES_USER:-hermes}" -d "${POSTGRES_DB:-hermes_db}" -tAc "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL"' </dev/null | tr -d '[:space:]')"
          FAILED_COUNT="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production exec -T postgres \
            sh -c 'psql -U "${POSTGRES_USER:-hermes}" -d "${POSTGRES_DB:-hermes_db}" -tAc "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL"' </dev/null | tr -d '[:space:]')"
          if [ "${APPLIED_COUNT}" != "${TARGET_MIGRATION_COUNT}" ]; then
            echo "Refusing to replace hermes-web: applied migration count ${APPLIED_COUNT} != expected ${TARGET_MIGRATION_COUNT}." >&2
            exit 1
          fi
          if [ "${FAILED_COUNT}" != "0" ]; then
            echo "Refusing to replace hermes-web: ${FAILED_COUNT} unresolved migration row(s) are unfinished." >&2
            exit 1
          fi
          echo "Migrations verified: ${APPLIED_COUNT}/${TARGET_MIGRATION_COUNT} applied, 0 unresolved."
          # NOTE: a migration failure above stops the deploy with the previous
          # release still serving traffic. It is NEVER answered by an automatic
          # database restore — recovery is a separate human-decided operation.

          # ── Replace ONLY hermes-web (image already built above) ──────────────
          export GIT_REVISION="${TARGET_SHA}"
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production up -d --no-deps hermes-web
          docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production ps hermes-web

          # ── DA-3: does the container now serving traffic come from THIS
          # commit?
          #
          # `git rev-parse HEAD` proves where the checkout is and `ps` proves
          # that a container runs; neither says which commit built the thing
          # answering requests. The check reads the revision METADATA of the
          # image the container is bound to — by image id, never by tag, and
          # never from the container's own labels, which can be set at run
          # time. It is NOT a signature and not proof that the bytes came from
          # that commit; it closes the gap that nothing said anything at all.
          RUNNING_CID="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production ps -q hermes-web)"
          if bash scripts/deploy/attest-image-revision.sh "${TARGET_SHA}" "${RUNNING_CID}"; then
            echo "Revision metadata matches the target SHA."
          else
            # The release is NOT good, and the container has already been
            # replaced. Putting the previous release back is its own
            # script, scripts/deploy/rollback-to-previous-good.sh, because
            # this is the one path that runs when production is ALREADY
            # broken and it had never been executed anywhere while it lived
            # in this file. Its cases - no preserved image, an image with no
            # revision label, a container that comes back on the wrong image
            # or unhealthy - are driven against real images and containers
            # in scripts/__tests__/rollback-to-previous-good.docker.test.ts.
            echo "::error::Image revision attestation failed for ${TARGET_SHA}; rolling back." >&2
            bash scripts/deploy/rollback-to-previous-good.sh \
              --project hermes --file docker-compose.prod.yml \
              --env-file .env.production --service hermes-web \
              --preserved hermes-web:previous-good || true

            # The run fails whether or not the rollback worked: a rollback
            # is a recovered failure, not a completed release, and must
            # never be reported as one. The script's own exit code says
            # whether production is back; this exit says the RELEASE did
            # not happen.
            exit 1
          fi

          # ── POST-DEPLOY health gate (fail closed, bounded, changes nothing) ──
          # `up -d` returns once the new container is STARTED, long before its
          # first health probe, so the `ps` snapshot above normally reads
          # "(health: starting)". Without this gate a release that crash-loops,
          # never turns healthy or cannot reach PostgreSQL still finished green.
          #
          # It waits (bounded) for the container's own healthcheck to report
          # healthy, requires the container to be running and never restarted,
          # then asks /api/health/ready — from inside the container — for exactly
          # status "ready" with database true. unhealthy, a restart loop, a
          # timeout, an unreadable state or any other response fails the job.
          #
          # On failure only validated state fields are printed: never container
          # logs, never a response body. It restarts, tags, rebuilds and rolls
          # back NOTHING; `hermes-web:previous-good` stays the rollback target and
          # using it is a separate, human-decided operation.
          #
          # Every child process gets </dev/null: this script arrives over
          # `bash -s`, so a command that reads stdin would swallow the script.
          # >>> post-deploy-health-gate
          hg_refuse() { echo "Post-deploy health gate FAILED: $*" >&2; exit 1; }
          hg_uint() {
            case "$2" in
              *[!0-9]*|''|0*) hg_refuse "$1 must be a positive integer without leading zeros." ;;
            esac
            if [ "${#2}" -gt 4 ] || [ "$2" -gt "$3" ]; then
              hg_refuse "$1 must be between 1 and $3."
            fi
          }
          HG_WAIT="${DEPLOY_HEALTH_WAIT_SECONDS:-240}"
          HG_POLL="${DEPLOY_HEALTH_POLL_SECONDS:-5}"
          HG_READY_TRIES="${DEPLOY_READY_ATTEMPTS:-6}"
          HG_READY_PAUSE="${DEPLOY_READY_PAUSE_SECONDS:-5}"
          hg_uint DEPLOY_HEALTH_WAIT_SECONDS "${HG_WAIT}" 900
          hg_uint DEPLOY_HEALTH_POLL_SECONDS "${HG_POLL}" 60
          hg_uint DEPLOY_READY_ATTEMPTS "${HG_READY_TRIES}" 30
          hg_uint DEPLOY_READY_PAUSE_SECONDS "${HG_READY_PAUSE}" 60

          # Reads the container state in ONE inspect call and accepts it only if
          # every field is a short plain token, so nothing unexpected is ever echoed.
          hg_state() {
            local raw extra v
            raw="$(docker inspect -f '{{.State.Status}} {{.State.Restarting}} {{.RestartCount}} {{if .State.Health}}{{.State.Health.Status}} {{.State.Health.FailingStreak}}{{else}}none 0{{end}} {{.State.ExitCode}} {{.State.OOMKilled}}' "${HG_CID}" </dev/null 2>/dev/null)" || return 1
            read -r HG_STATUS HG_RESTARTING HG_RESTARTS HG_HEALTH HG_STREAK HG_EXIT HG_OOM extra <<<"${raw}" || return 1
            [ -z "${extra}" ] || return 1
            for v in "${HG_STATUS}" "${HG_RESTARTING}" "${HG_RESTARTS}" "${HG_HEALTH}" "${HG_STREAK}" "${HG_EXIT}" "${HG_OOM}"; do
              case "${v}" in *[!A-Za-z0-9_-]*|'') return 1 ;; esac
              [ "${#v}" -le 32 ] || return 1
            done
          }
          hg_fail() {
            echo "Post-deploy health gate FAILED: $*" >&2
            echo "hermes-web state: status=${HG_STATUS:-unknown} restarting=${HG_RESTARTING:-unknown} restart_count=${HG_RESTARTS:-unknown} health=${HG_HEALTH:-unknown} failing_streak=${HG_STREAK:-unknown} exit_code=${HG_EXIT:-unknown} oom_killed=${HG_OOM:-unknown}" >&2
            echo "Nothing was rolled back, restarted or changed by this gate; hermes-web:previous-good is preserved. Recovery is a separate, human-decided operation." >&2
            exit 1
          }

          HG_CID="$(docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production ps -q hermes-web </dev/null | head -n 1 || true)"
          if [ -z "${HG_CID}" ]; then
            hg_refuse "no hermes-web container exists after the cutover."
          fi
          case "${HG_CID}" in
            *[!0-9a-f]*) hg_refuse "the hermes-web container id is malformed." ;;
          esac

          hg_waited=0
          while :; do
            hg_state || hg_refuse "could not read the hermes-web container state."
            if [ "${HG_RESTARTING}" != "false" ] || [ "${HG_RESTARTS}" != "0" ]; then
              hg_fail "hermes-web is in a restart loop."
            fi
            if [ "${HG_STATUS}" != "running" ]; then
              hg_fail "hermes-web is not running."
            fi
            case "${HG_HEALTH}" in
              healthy) break ;;
              unhealthy) hg_fail "hermes-web reported unhealthy." ;;
              starting) ;;
              *) hg_fail "hermes-web exposes no usable healthcheck status." ;;
            esac
            if [ "${hg_waited}" -ge "${HG_WAIT}" ]; then
              hg_fail "hermes-web did not become healthy within ${HG_WAIT}s."
            fi
            sleep "${HG_POLL}" </dev/null
            hg_waited=$((hg_waited + HG_POLL))
          done

          # The readiness body is public by design (booleans and a status string
          # only), but it is validated here and never printed.
          HG_READY_RE_A='^\{[[:space:]]*"status"[[:space:]]*:[[:space:]]*"ready"[[:space:]]*,[[:space:]]*"database"[[:space:]]*:[[:space:]]*true[[:space:]]*\}[[:space:]]*$'
          HG_READY_RE_B='^\{[[:space:]]*"database"[[:space:]]*:[[:space:]]*true[[:space:]]*,[[:space:]]*"status"[[:space:]]*:[[:space:]]*"ready"[[:space:]]*\}[[:space:]]*$'
          HG_READY_OK=0
          HG_PROBE_CLASS="no readiness probe ran"
          hg_try=0
          while [ "${hg_try}" -lt "${HG_READY_TRIES}" ]; do
            hg_try=$((hg_try + 1))
            HG_RC=0
            HG_BODY="$(docker exec "${HG_CID}" wget -qO- -T 8 http://127.0.0.1:3000/api/health/ready </dev/null 2>/dev/null | head -c 512)" || HG_RC=$?
            if [ "${HG_RC}" -ne 0 ]; then
              HG_PROBE_CLASS="the readiness request failed (exit code ${HG_RC})"
            elif [ -z "${HG_BODY}" ]; then
              HG_PROBE_CLASS="the readiness response was empty"
            elif [[ "${HG_BODY}" =~ ${HG_READY_RE_A} ]] || [[ "${HG_BODY}" =~ ${HG_READY_RE_B} ]]; then
              HG_READY_OK=1
              break
            else
              HG_PROBE_CLASS="the readiness response was not status=ready with database=true"
            fi
            if [ "${hg_try}" -lt "${HG_READY_TRIES}" ]; then
              sleep "${HG_READY_PAUSE}" </dev/null
            fi
          done
          if [ "${HG_READY_OK}" -ne 1 ]; then
            hg_state || true
            hg_fail "/api/health/ready did not report ready after ${hg_try} attempt(s): ${HG_PROBE_CLASS}."
          fi

          # A healthy process and a ready database do not prove that the public
          # pages search engines crawl actually render. Probe the core public
          # entry points from inside hermes-web, with no response bodies or
          # credentials ever printed. wget fails on 4xx/5xx, so a failure makes
          # the deployment fail closed without changing, restarting or rolling
          # back anything. This is an application-route gate, not a CDN/edge
          # availability monitor; external monitoring remains required for that.
          HG_PUBLIC_ROUTES="
            /fa /en /de
            /fa/platform /en/services/plc /fa/services/scada-hmi
            /en/industrial-brain /fa/brain /en/articles /fa/library /en/careers
            /robots.txt /sitemap.xml
          "
          for HG_ROUTE in ${HG_PUBLIC_ROUTES}; do
            case "${HG_ROUTE}" in
              /fa|/en|/de|/fa/platform|/en/services/plc|/fa/services/scada-hmi|/en/industrial-brain|/fa/brain|/en/articles|/fa/library|/en/careers|/robots.txt|/sitemap.xml) ;;
              *) hg_refuse "public route probe list contains an unexpected path." ;;
            esac
            if ! docker exec "${HG_CID}" wget -q -T 8 -O /dev/null "http://127.0.0.1:3000${HG_ROUTE}" </dev/null 2>/dev/null; then
              hg_fail "public route probe failed for ${HG_ROUTE}."
            fi
          done

          # A restart that happens AFTER the readiness answer is still a failure.
          hg_state || hg_refuse "could not re-read the hermes-web container state."
          if [ "${HG_STATUS}" != "running" ] || [ "${HG_HEALTH}" != "healthy" ] || [ "${HG_RESTARTING}" != "false" ] || [ "${HG_RESTARTS}" != "0" ]; then
            hg_fail "hermes-web was not stable after the readiness check."
          fi
          echo "Post-deploy health gate passed: hermes-web healthy after ${hg_waited}s, restart_count=0, /api/health/ready reported status=ready database=true."
          # <<< post-deploy-health-gate
          REMOTE

      # Gate 0D-A (scripts/production-compose-project-static-check.mjs) is the
      # authority on the shape of every command above. Running it here as well
      # means a change to this workflow cannot reach a deploy attempt without
      # first satisfying the same static contract CI enforces on pull requests.
      - name: Re-assert the production Compose contract (Gate 0D-A)
        if: always()
        run: node scripts/production-compose-project-static-check.mjs
