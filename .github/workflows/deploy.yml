# Production deployment — MANUAL ONLY (Gate 0A safety contract).
#
# - No push trigger: merging to main never deploys by itself.
# - workflow_dispatch requires an exact 40-hex commit SHA plus the literal
#   confirmation phrase, and runs in the protected "production" environment
#   (required reviewers are configured in repository settings, not here).
# - The selected commit must already be part of approved main history,
#   verified both on the runner and again on the server.
# - SSH trusts only the pinned host key from the SSH_KNOWN_HOSTS secret;
#   runtime ssh-keyscan is forbidden. SSH_PORT is optional (default 22) and
#   validated before use; for a non-default port the pinned known_hosts line
#   must use the matching "[host]:port" form.
# - The remote operator must be the documented non-root deploy user.
# - The server checks out the exact SHA (no unbounded git pull) and rebuilds
#   only the hermes-web service: postgres, redis, nginx, named volumes and the
#   host itself are never stopped, recreated, pruned or restarted.
# - Every Compose command pins the canonical Production project with
#   "-p hermes" (Gate 0D-A): the project name must never be derived from the
#   checkout directory, which once created a second empty "hermes-os-nexuz"
#   stack beside the real one.

name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Exact 40-character commit SHA on main to deploy"
        required: true
        type: string
      confirm:
        description: 'Type "deploy-to-production" to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pinned commit to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy-to-production" ]; then
            echo "Confirmation phrase mismatch — refusing to deploy." >&2
            exit 1
          fi

      - name: Validate commit SHA format
        run: |
          # Whole-string check (not line-based): rejects any non-hex byte,
          # including whitespace and newlines, and enforces exact length 40.
          case "$TARGET_SHA" in
            *[!0-9a-f]*|'')
              echo "commit_sha must be an exact 40-character lowercase hex SHA." >&2
              exit 1
              ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "commit_sha must be an exact 40-character lowercase hex SHA." >&2
            exit 1
          fi

      - name: Check out main history (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the commit belongs to approved main history
        run: |
          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "Refusing: ${TARGET_SHA} is not a commit reachable from main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "Refusing: ${TARGET_SHA} is not an ancestor of main." >&2
            exit 1
          fi

      - name: Validate connection configuration
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [ -z "$SERVER_IP" ]; then
            echo "SERVER_IP secret is required (fail closed)." >&2
            exit 1
          fi
          if [ -z "$SERVER_USER" ] || [ "$SERVER_USER" = "root" ]; then
            echo "SERVER_USER must be the documented non-root production operator." >&2
            exit 1
          fi
          # SSH_PORT is optional; default 22. Whole-string integer check, then
          # range check (length guard first so the numeric test cannot overflow).
          PORT="${SSH_PORT:-22}"
          case "$PORT" in
            *[!0-9]*|'')
              echo "SSH_PORT must be an integer between 1 and 65535." >&2
              exit 1
              ;;
          esac
          if [ "${#PORT}" -gt 5 ] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "SSH_PORT must be an integer between 1 and 65535." >&2
            exit 1
          fi

      - name: Install SSH key and pinned host trust
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KEY and SSH_KNOWN_HOSTS secrets are required (fail closed)." >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          # Normalize CRLF line endings that UI copy/paste can introduce, then
          # prove the key is a usable unencrypted private key before any use.
          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null 2>&1; then
            echo "SSH_KEY is not a valid unencrypted private key." >&2
            exit 1
          fi
          # Host trust comes exclusively from this pinned secret — never from
          # runtime scanning. Use "[host]:port" entries for a non-default port.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy the pinned commit (targeted hermes-web rebuild)
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy \
              -p "$PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=yes \
              "${SERVER_USER}@${SERVER_IP}" \
              "TARGET_SHA=${TARGET_SHA} bash -s" <<'REMOTE'
          set -euo pipefail
          unset DOCKER_HOST

          if [ "$(id -u)" -eq 0 ]; then
            echo "Refusing to deploy as root on the production host." >&2
            exit 1
          fi

          cd /opt/hermes-os-nexuz

          git fetch --prune origin
          if ! git cat-file -e "${TARGET_SHA}^{commit}"; then
            echo "Refusing: ${TARGET_SHA} is unknown on the server after fetch." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" origin/main; then
            echo "Refusing: ${TARGET_SHA} is not on origin/main." >&2
            exit 1
          fi

          git checkout --detach "$TARGET_SHA"

          # ── PHASE 95 — OpenBao activation contract (fail-closed, marker-gated) ──
          # A stable, root-owned marker decides whether THIS and every future
          # deploy activates the OpenBao overlay, so a plain redeploy can no longer
          # silently drop it. Absent → base compose only (backend disabled). Present
          # → strictly validated; it names ONLY non-secret host references. The real
          # AppRole material is never in the marker, the env, argv, or any log.
          MARKER=/etc/hermes-openbao/activation.env
          REPO_ROOT=/opt/hermes-os-nexuz

          deploy_base() {
            docker compose -p hermes -f docker-compose.prod.yml up -d --build --no-deps hermes-web
          }

          wait_healthy() {
            # $1 = container id. Prints only the health status word, never secrets.
            cid_w="$1"
            i=0
            while [ "$i" -lt 60 ]; do
              st="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid_w" 2>/dev/null || echo error)"
              [ "$st" = healthy ] && return 0
              [ "$st" = unhealthy ] && return 1
              i=$((i + 1)); sleep 5
            done
            return 1
          }

          if [ ! -e "$MARKER" ]; then
            echo "OpenBao activation marker absent — deploying BASE compose (backend disabled)."
            deploy_base
            cid_base="$(docker compose -p hermes -f docker-compose.prod.yml ps -q hermes-web)"
            wait_healthy "$cid_base" || { echo "base hermes-web did not become healthy." >&2; exit 1; }
            echo "Base deploy healthy (OpenBao disabled)."
            exit 0
          fi

          echo "OpenBao activation marker present — validating (fail closed)."

          # Marker file integrity: regular file, not a symlink, root:root, no 'other' bits.
          if [ -L "$MARKER" ] || [ ! -f "$MARKER" ]; then
            echo "Refusing: marker is not a regular file." >&2; exit 1
          fi
          if [ "$(stat -c '%U:%G' "$MARKER")" != "root:root" ]; then
            echo "Refusing: marker is not owned root:root." >&2; exit 1
          fi
          mmode="$(stat -c '%a' "$MARKER")"
          while [ "${#mmode}" -lt 3 ]; do mmode="0$mmode"; done
          if [ "$((0$mmode & 007))" -ne 0 ]; then
            echo "Refusing: marker grants 'other' permissions." >&2; exit 1
          fi

          # Strict allow-listed KEY=VALUE parse — NO source/eval. The charset check
          # rejects any shell command / command substitution ($, backtick, (), ;, |,
          # &, redirects, quotes, spaces). Unknown keys, duplicates and non KEY=VALUE
          # lines are rejected.
          ROLE_ID_HOST_FILE=""; SECRET_ID_HOST_FILE=""; CA_HOST_FILE=""; PRIVATE_IP=""; RUNTIME_GID=""
          seen=" "
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            case "$line" in *[!A-Za-z0-9._/=-]*) echo "Refusing: illegal character in marker." >&2; exit 1;; esac
            case "$line" in *=*) : ;; *) echo "Refusing: marker line is not KEY=VALUE." >&2; exit 1;; esac
            key="${line%%=*}"; val="${line#*=}"
            case "$val" in *=*) echo "Refusing: marker value contains '='." >&2; exit 1;; esac
            [ -n "$key" ] && [ -n "$val" ] || { echo "Refusing: empty marker key/value." >&2; exit 1; }
            case " OPENBAO_ROLE_ID_HOST_FILE OPENBAO_SECRET_ID_HOST_FILE OPENBAO_CA_HOST_FILE OPENBAO_PRIVATE_IP OPENBAO_RUNTIME_GID " in
              *" $key "*) : ;;
              *) echo "Refusing: unknown marker key." >&2; exit 1;;
            esac
            case "$seen" in *" $key "*) echo "Refusing: duplicate marker key." >&2; exit 1;; esac
            seen="$seen$key "
            case "$key" in
              OPENBAO_ROLE_ID_HOST_FILE) ROLE_ID_HOST_FILE="$val";;
              OPENBAO_SECRET_ID_HOST_FILE) SECRET_ID_HOST_FILE="$val";;
              OPENBAO_CA_HOST_FILE) CA_HOST_FILE="$val";;
              OPENBAO_PRIVATE_IP) PRIVATE_IP="$val";;
              OPENBAO_RUNTIME_GID) RUNTIME_GID="$val";;
            esac
          done < "$MARKER"

          if [ -z "$ROLE_ID_HOST_FILE" ] || [ -z "$SECRET_ID_HOST_FILE" ] || [ -z "$CA_HOST_FILE" ] || [ -z "$PRIVATE_IP" ] || [ -z "$RUNTIME_GID" ]; then
            echo "Refusing: marker is missing a required key." >&2; exit 1
          fi

          # OPENBAO_RUNTIME_GID: a plain number in range.
          case "$RUNTIME_GID" in *[!0-9]*|'') echo "Refusing: OPENBAO_RUNTIME_GID not numeric." >&2; exit 1;; esac
          if [ "$RUNTIME_GID" -lt 1 ] || [ "$RUNTIME_GID" -gt 65535 ]; then
            echo "Refusing: OPENBAO_RUNTIME_GID out of range." >&2; exit 1
          fi

          # OPENBAO_PRIVATE_IP: valid IPv4 in an RFC1918 private range (never public).
          case "$PRIVATE_IP" in *[!0-9.]*) echo "Refusing: OPENBAO_PRIVATE_IP not IPv4." >&2; exit 1;; esac
          oIFS="$IFS"; IFS=.; set -- $PRIVATE_IP; IFS="$oIFS"
          [ "$#" -eq 4 ] || { echo "Refusing: OPENBAO_PRIVATE_IP is not a dotted quad." >&2; exit 1; }
          for o in "$@"; do
            case "$o" in ''|*[!0-9]*) echo "Refusing: bad IPv4 octet." >&2; exit 1;; esac
            [ "$o" -le 255 ] || { echo "Refusing: IPv4 octet > 255." >&2; exit 1; }
          done
          ip_a="$1"; ip_b="$2"; priv=0
          [ "$ip_a" -eq 10 ] && priv=1
          [ "$ip_a" -eq 192 ] && [ "$ip_b" -eq 168 ] && priv=1
          [ "$ip_a" -eq 172 ] && [ "$ip_b" -ge 16 ] && [ "$ip_b" -le 31 ] && priv=1
          [ "$priv" -eq 1 ] || { echo "Refusing: OPENBAO_PRIVATE_IP is not a private-range address." >&2; exit 1; }

          # Source files must be absolute, out-of-repo, regular (never symlinks).
          check_regular_outside() {
            p="$1"
            case "$p" in /*) : ;; *) echo "Refusing: credential path is not absolute." >&2; exit 1;; esac
            case "$p" in "$REPO_ROOT"|"$REPO_ROOT"/*) echo "Refusing: credential path is inside the repository." >&2; exit 1;; esac
            [ ! -L "$p" ] || { echo "Refusing: credential path is a symlink." >&2; exit 1; }
            [ -f "$p" ] || { echo "Refusing: credential path is not a regular file." >&2; exit 1; }
          }

          # RoleID / SecretID runtime copies: root:<RUNTIME_GID>, mode EXACTLY 0440.
          check_role_secret() {
            check_regular_outside "$1"
            [ "$(stat -c '%U' "$1")" = root ] || { echo "Refusing: credential not owned by root." >&2; exit 1; }
            [ "$(stat -c '%g' "$1")" = "$RUNTIME_GID" ] || { echo "Refusing: credential group is not the runtime GID." >&2; exit 1; }
            [ "$(stat -c '%a' "$1")" = 440 ] || { echo "Refusing: credential mode is not exactly 0440." >&2; exit 1; }
          }
          check_role_secret "$ROLE_ID_HOST_FILE"
          check_role_secret "$SECRET_ID_HOST_FILE"

          # CA: out-of-repo regular file, read-only (no group/other write), readable by runtime.
          check_regular_outside "$CA_HOST_FILE"
          camode="$(stat -c '%a' "$CA_HOST_FILE")"
          while [ "${#camode}" -lt 3 ]; do camode="0$camode"; done
          if [ "$((0$camode & 022))" -ne 0 ]; then
            echo "Refusing: CA file is group/other writable." >&2; exit 1
          fi
          ca_g="$(stat -c '%g' "$CA_HOST_FILE")"
          if [ "$((0$camode & 004))" -eq 0 ] && ! { [ "$ca_g" = "$RUNTIME_GID" ] && [ "$((0$camode & 040))" -ne 0 ]; }; then
            echo "Refusing: CA file is not readable by the runtime (need o+r, or group=runtime with g+r)." >&2; exit 1
          fi

          # Export ONLY the validated non-secret references for compose interpolation.
          export OPENBAO_ROLE_ID_HOST_FILE="$ROLE_ID_HOST_FILE"
          export OPENBAO_SECRET_ID_HOST_FILE="$SECRET_ID_HOST_FILE"
          export OPENBAO_CA_HOST_FILE="$CA_HOST_FILE"
          export OPENBAO_PRIVATE_IP="$PRIVATE_IP"
          export OPENBAO_RUNTIME_GID="$RUNTIME_GID"

          # Fail closed if the merged Compose config is invalid.
          if ! docker compose -p hermes -f docker-compose.prod.yml -f docker-compose.prod.openbao.yml --env-file .env.production config >/dev/null; then
            echo "Refusing: merged OpenBao Compose config is invalid." >&2; exit 1
          fi

          echo "Marker validated — deploying WITH the OpenBao overlay."
          docker compose -p hermes -f docker-compose.prod.yml -f docker-compose.prod.openbao.yml --env-file .env.production up -d --build --no-deps hermes-web

          cid="$(docker compose -p hermes -f docker-compose.prod.yml -f docker-compose.prod.openbao.yml ps -q hermes-web)"

          verify_active() {
            [ -n "$cid" ] || return 1
            docker exec "$cid" sh -c '[ "$OT_SECRET_BACKEND" = openbao ]' || return 1
            docker exec "$cid" sh -c '[ -f /run/secrets/openbao_role_id ] && [ -r /run/secrets/openbao_role_id ]' || return 1
            docker exec "$cid" sh -c '[ -f /run/secrets/openbao_secret_id ] && [ -r /run/secrets/openbao_secret_id ]' || return 1
            docker exec "$cid" sh -c '[ -f /run/secrets/openbao_ca ] && [ -r /run/secrets/openbao_ca ]' || return 1
            docker exec "$cid" sh -c 'grep -qw openbao /etc/hosts' || return 1
            wait_healthy "$cid" || return 1
            return 0
          }

          if verify_active; then
            echo "OpenBao activation verified: backend enabled and hermes-web healthy."
            exit 0
          fi

          # Automatic rollback: recreate hermes-web from the BASE compose only, so
          # the final container has the backend DISABLED and becomes healthy again.
          echo "Activation verification FAILED — rolling back to base compose (backend disabled)." >&2
          docker compose -p hermes -f docker-compose.prod.yml up -d --build --no-deps hermes-web
          cid_rb="$(docker compose -p hermes -f docker-compose.prod.yml ps -q hermes-web)"
          if wait_healthy "$cid_rb"; then
            echo "Rollback complete: backend disabled, hermes-web healthy." >&2
          else
            echo "Rollback hermes-web did not become healthy." >&2
          fi
          exit 1
          REMOTE
