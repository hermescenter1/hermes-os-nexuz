# Hermes OS — Production Compose
#
# Default SSL strategy: Nginx + Certbot (Let's Encrypt).
# See deploy/ssl/README.md for Cloudflare and external-proxy alternatives.
#
# Usage:
#   docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production up --build -d
#
# The --env-file flag lets docker compose read .env.production for ${VAR} interpolation
# inside this file (build args), in addition to injecting vars into the container at runtime.
#
# With monitoring (ideally on a separate host — see deploy/monitoring/README.md):
#   docker compose -p hermes -f docker-compose.prod.yml --profile monitoring up -d
#
# Migrations (first run AND every migration-bearing release) — the hermes-web
# image ships only the Prisma runtime, not the CLI, and its CMD never applies
# migrations. Use the profile-gated migrator service (Phase 99.7), which is
# built from the same pinned checkout as the release:
#   docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production \
#     --profile migrate build hermes-migrate
#   docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production \
#     --profile migrate run --rm -T hermes-migrate
# Verify afterwards (exits non-zero while any migration is pending):
#   docker compose -p hermes -f docker-compose.prod.yml --env-file .env.production \
#     --profile migrate run --rm -T hermes-migrate node node_modules/prisma/build/index.js migrate status
#
# Required in .env.production:
#   NEXT_PUBLIC_GA_MEASUREMENT_ID=G-XXXXXXXXXX   (client bundle — baked at build time)
#   GA_MEASUREMENT_ID=G-XXXXXXXXXX               (server layout — read at request time)

# Gate 0D-A — canonical Production Compose project name (defense in depth).
# Without this, Compose derives the project from the checkout directory; an
# unpinned invocation from /opt/hermes-os-nexuz once created a second, empty
# "hermes-os-nexuz" stack (new network + empty named volumes) beside the real
# "hermes" stack. The canonical resources are hermes_postgres_data and
# hermes_hermes_internal. Explicit `-p hermes` remains MANDATORY on every
# Production command even with this default in place.
name: hermes

services:
  hermes-web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be build-args so webpack bakes them into the client bundle.
      # Pass --env-file .env.production to docker compose so ${VAR} interpolation works.
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        # SEO canonical host — build-time only. Defaults to the production canonical
        # host; set NEXT_PUBLIC_BASE_URL in .env.production only to override.
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://hermesnovin.com}
    restart: unless-stopped
    env_file: .env.production
    volumes:
      # Phase 76: Persist author avatar uploads across container rebuilds.
      # Without this volume, /app/public/uploads is lost on every docker build.
      - uploads_data:/app/public/uploads
      # Phase 98: Persist uploaded documents, extracted text and compliance export
      # packages (HERMES_LOCAL_DOCUMENT_STORAGE_DIR, default /app/.data/documents).
      # Discovery found this durable-intent data had NO backing volume and was lost
      # on container rebuild. Additive — existing volumes are unchanged. A one-time
      # owner step is required on the live host to populate this new volume from any
      # data currently on the container's writable layer (see the DR runbook).
      - documents_data:/app/.data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hermes_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── ATS-S1 — the ATS AI-review worker ───────────────────────────────────────
  #
  # The public intake writes an application at AI_REVIEW_PENDING together with a
  # review-outbox row, in one transaction. This service is what makes those rows
  # move. Without it every application stays AI_REVIEW_PENDING forever — safe
  # (nothing advances), visible, and useless.
  #
  # SAME PATTERN AS hermes-metering-worker BELOW, deliberately. It is a THIN
  # TRIGGER: it polls POST /api/ats/review/deliver on hermes-web, where the
  # review pass, the lease and the stage gate live and are tested. Its own image
  # stage (`ats-review-worker`) holds ONE .mjs file — no node_modules, no Prisma,
  # no database credential, no volume, no ports.
  #
  # WHAT IT CAN CAUSE. Exactly one transition, AI_REVIEW_PENDING ->
  # PENDING_HUMAN_APPROVAL, and only through that endpoint. It cannot advance,
  # reject or hire anyone: only a recorded human decision leaves the gate.
  # Logs are pass COUNTS only; no candidate field is ever in its output.
  #
  # SCALING. Safe with `--scale hermes-ats-review-worker=N`: the pass takes the
  # platform's WorkerLease under its own job name ("ats.review.outbox"), and the
  # conditional per-row outbox claim means no application is reviewed twice even
  # if the lease is lost.
  #
  # REQUIRED CONFIGURATION. `ATS_REVIEW_WORKER_TOKEN` in .env.production — the
  # same value hermes-web reads to authorise the endpoint. Without it this
  # container exits 2 at startup with a message that says why, instead of logging
  # a 401 every interval forever. No health check, exactly as for the metering
  # worker — it serves nothing to probe, and `restart: unless-stopped` covers a
  # crash.
  hermes-ats-review-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ats-review-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      HERMES_WORKER_BASE_URL: http://hermes-web:3000
    # Stated explicitly rather than relying on the stage CMD, so the thing this
    # service runs is visible in the compose file an operator reads.
    command: ["node", "scripts/ats/ai-review-worker.mjs"]
    depends_on:
      hermes-web:
        condition: service_healthy
    networks:
      - hermes_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── PHASE 109-C-UI.2-R8 — the metering outbox worker ────────────────────────
  #
  # R7 made industrial metering durable: the run writes an outbox row inside its
  # own transaction instead of a fire-and-forget call that could vanish. Nothing
  # delivered those rows, so they accumulated as PENDING and no UsageRecord was
  # ever written. This service is what runs the delivery.
  #
  # It is a THIN TRIGGER, not the worker. The delivery logic lives in the app —
  # the same TypeScript the test suites exercise against real PostgreSQL — and
  # this process polls POST /api/industrial/metering/deliver on a bounded
  # interval. It therefore needs no database credentials, no Prisma, and no
  # volume: it holds no state and can be killed at any moment without losing an
  # event.
  #
  # WHY ITS OWN IMAGE. Reusing the web image with a different command looked
  # simpler and was wrong: phase106a-journal-import-path.test.ts asserts the
  # runner stage copies NO scripts, a contract written after Phase 106 shipped an
  # importer that could reach production content. The `metering-worker` stage is
  # therefore tiny and separate — no node_modules, no Prisma, no application
  # code, and no database credential. A compromised worker container can trigger
  # delivery through the authenticated endpoint and nothing else.
  #
  # SCALING. Safe to run with `--scale hermes-metering-worker=N`. Two guarantees
  # stack: a database lease means only one replica sweeps at a time, and the
  # conditional status transition on each outbox row means that even with the
  # lease gone no event is delivered twice.
  #
  # REQUIRED CONFIGURATION. `METERING_WORKER_TOKEN` (or the existing
  # `METRICS_TOKEN`) must be set in .env.production. The worker entrypoint never
  # falls open, so without a token this container exits 2 at startup with a
  # message that says why, rather than logging a 401 every interval forever.
  hermes-metering-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: metering-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      HERMES_WORKER_BASE_URL: http://hermes-web:3000
    # Stated explicitly rather than relying on the stage CMD, so the thing this
    # service runs is visible in the compose file an operator reads.
    command: ["node", "scripts/industrial/metering-outbox-worker.mjs"]
    depends_on:
      hermes-web:
        condition: service_healthy
    networks:
      - hermes_internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Phase 99.7 — explicit, profile-gated migration runner. NEVER started by
  # `up -d` (the "migrate" profile is off by default), holds no ports, and is
  # only ever invoked as `--profile migrate run --rm hermes-migrate` by the
  # deploy workflow / operator. Built from the pinned release checkout, so the
  # applied migration set is exactly the target commit's.
  hermes-migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file: .env.production
    networks:
      - hermes_internal
    depends_on:
      postgres:
        condition: service_healthy

  # Phase 106A — explicit, profile-gated CONTENT import runner.
  #
  # Mirrors hermes-migrate deliberately: never started by `up -d` (the
  # "journal-import" profile is off by default), no ports, no restart policy, on
  # the internal network only, and invoked exclusively as
  #   --profile journal-import run --rm hermes-journal-import
  # so it is ephemeral and can never linger as a stack member.
  #
  # It is a SEPARATE service from hermes-migrate because schema migration and
  # content import are separate operations with separate blast radii: the
  # migration is additive and reversible in review, the import writes production
  # content. Merging them would make "the migration succeeded" and "the corpus
  # imported" a single indivisible outcome.
  #
  # DATABASE_URL comes from .env.production — the same secure runtime source the
  # migrator and the web service use. No credential is written into this file,
  # and postgres keeps no published port: this service reaches it only over
  # hermes_internal.
  #
  # The image CMD is the DRY RUN. Writing requires the operator to append
  # `--commit` explicitly; see docs/phase106/production-import-runbook.md.
  hermes-journal-import:
    profiles: ["journal-import"]
    build:
      context: .
      dockerfile: Dockerfile
      target: journal-importer
    env_file: .env.production
    networks:
      - hermes_internal
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hermes_internal
    # No public port — internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes} -d ${POSTGRES_DB:-hermes_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-changeme}"
    volumes:
      - redis_data:/data
    networks:
      - hermes_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Dedicated HTTPS vhost for Stalwart mail/account UI.
      - ./deploy/nginx/mail.conf:/etc/nginx/conf.d/mail.conf:ro
      # Certbot SSL certificates (managed by Certbot on the VPS — see deploy/ssl/README.md)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot ACME webroot challenge directory
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      - hermes-web
    networks:
      - hermes_internal
      - stalwart_external
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && wget -qO- http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Optional monitoring ────────────────────────────────────────────────────
  # NOTE: For real production, run Uptime Kuma on a SEPARATE VPS so monitoring
  # survives app downtime. This profile is provided for single-server setups.
  # Start with: docker compose -p hermes -f docker-compose.prod.yml --profile monitoring up -d
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - hermes_internal

volumes:
  postgres_data:
  redis_data:
  uptime_kuma_data:
  uploads_data:
  # Phase 98: durable document/export storage (see hermes-web volumes above).
  documents_data:

networks:
  hermes_internal:
    driver: bridge

  # Existing Stalwart network used only by Hermes Nginx for the
  # mail.hermesnovin.com reverse proxy.
  stalwart_external:
    external: true
    name: stalwart-mail_default
