# Hermes OS — logrotate INSTALLATION TEMPLATE for the OpenBao STAGING audit log
# (PHASE 94D0G). Host-side rotation for the staging audit device ONLY — never a
# production container, never any other log.
#
# THIS FILE IS A TEMPLATE. Do NOT install it before every __PLACEHOLDER__ below
# has been replaced and the result reviewed.
#
# Placeholders (operator substitutes before installing):
#   __OPENBAO_STAGING_TLS_DIR__            host TLS directory given to Compose
#                                          as OPENBAO_STAGING_TLS_DIR
#   __OPENBAO_STAGING_AUDIT_DIR__          host audit directory given to Compose
#                                          as OPENBAO_STAGING_AUDIT_DIR
#   __HERMES_REPOSITORY_ABSOLUTE_PATH__    absolute path of this repository
#                                          checkout on the Docker host
# Owner/group are intentionally omitted from the create directive. Logrotate
# inherits both attributes from the original audit.log; deployment preflight
# verifies that the original file is owned by UID 100 and GID 1000.
#
# INSTALLATION (operator, on the Docker host):
#   1. Substitute all placeholders above.
#   2. Review the result.
#   3. Copy to /etc/logrotate.d/hermes-openbao-audit
#   4. Dry run:  logrotate -d /etc/logrotate.d/hermes-openbao-audit

__OPENBAO_STAGING_AUDIT_DIR__/audit.log {
    # Rotate this exact staging audit file only. No wildcards, no other paths.
    daily
    maxsize 50M
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    # Rename-then-recreate (NOT copytruncate). The original audit.log
    # owner/group are inherited; deployment preflight requires ownership
    # 100:1000. Mode remains 0600 so OpenBao can reopen after SIGHUP.
    create 0600
    sharedscripts
    postrotate
        OPENBAO_STAGING_TLS_DIR="__OPENBAO_STAGING_TLS_DIR__" \
        OPENBAO_STAGING_AUDIT_DIR="__OPENBAO_STAGING_AUDIT_DIR__" \
        docker compose \
          -p hermes-openbao-staging \
          -f __HERMES_REPOSITORY_ABSOLUTE_PATH__/docker-compose.openbao-staging.yml \
          kill -s HUP openbao
    endscript
}
